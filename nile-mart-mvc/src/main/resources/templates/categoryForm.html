<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nile Mart - New category</title>
    <th:block th:replace="~{fragments/layout :: styles}"></th:block>
</head>
<body>
<nav th:replace="~{fragments/layout :: menu}"></nav>

<h1>New Category</h1>

<form th:action="@{/categories}" th:object="${category}" method="post">
    <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" th:field="*{name}">
        <span class="error" th:each="err : ${#fields.errors('name')}" th:text="${err}"></span>
    </div>
    <div class="field">
        <label for="slug">Slug</label>
        <input type="text" id="slug" th:field="*{slug}">
        <span class="error" th:each="err : ${#fields.errors('slug')}" th:text="${err}"></span>
    </div>
    <div class="field">
        <label for="parentSlug">Parent</label>
        <select id="parentSlug" th:field="*{parentSlug}">
            <option value="">None (top level)</option>
            <option th:each="p : ${parents}" th:value="${p.slug}" th:text="${p.name}"></option>
        </select>
        <span class="error" th:each="err : ${#fields.errors('parentSlug')}" th:text="${err}"></span>
    </div>
    <div class="field">
        <label for="displayOrder">Display order</label>
        <input type="text" id="displayOrder" th:field="*{displayOrder}">
        <span class="error" th:each="err : ${#fields.errors('displayOrder')}" th:text="${err}"></span>
    </div>
    <div class="field">
        <input type="checkbox" id="active" th:field="*{active}">
        <label class="inline" for="active">Active</label>
    </div>
    <button type="submit">Save category</button>
</form>
<p><a th:href="@{/categories}">Back to categories</a></p>
</body>
</html>
