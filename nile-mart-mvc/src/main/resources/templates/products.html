<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nile-Mart - Products</title>
    <th:block th:replace="~{fragments/layout :: styles}"></th:block>
</head>
<body>
<nav th:replace="~{fragments/layout :: menu}"></nav>

<h1>Available Products</h1>
<p class="actions"><a class="button" th:href="@{/products/new}">Add product</a></p>

<table>
    <thead>
    <tr>
        <th>SKU</th>
        <th>Name</th>
        <th>Price</th>
        <th>Stock</th>
        <th>Category</th>
        <th>Brand</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="product : ${availableProducts}">
        <td th:text="${product.sku}"></td>
        <td th:text="${product.name}"></td>
        <td th:text="${product.price}"></td>
        <td th:text="${product.inStock}"></td>
        <td th:text="${product.categoryName}"></td>
        <td th:text="${product.brandName}"></td>
    </tr>
    </tbody>
</table>
</body>
</html>
